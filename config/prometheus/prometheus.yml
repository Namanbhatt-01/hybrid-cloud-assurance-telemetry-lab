global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "synthetic_path_prober"
    scrape_interval: 3s
    static_configs:
      - targets: ["synthetic_prober:9200"]

  - job_name: "blackbox_http_ai_endpoints"
    metrics_path: /probe
    params:
      module: [http_2xx_ai_api]
    static_configs:
      - targets:
          - "http://172.30.0.30:11434/api/tags"
          - "http://172.30.0.30:8088/models/meta-llama"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"

  - job_name: "blackbox_http_inference_post"
    metrics_path: /probe
    params:
      module: [http_post_inference]
    static_configs:
      - targets:
          - "http://172.30.0.30:11434/api/generate"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"

  - job_name: "blackbox_tcp_ai_ports"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - "172.30.0.30:11434"
          - "172.30.0.30:8088"
          - "172.30.0.40:22"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox_exporter:9115"

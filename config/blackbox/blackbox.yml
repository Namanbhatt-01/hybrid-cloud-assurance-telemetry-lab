modules:
  http_2xx_ai_api:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200, 204]
      method: GET
      preferred_ip_protocol: "ip4"

  http_post_inference:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: POST
      headers:
        Content-Type: application/json
      body: '{"model": "llama3:8b", "prompt": "ping", "stream": false}'
      preferred_ip_protocol: "ip4"

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  dns_udp_probe:
    prober: dns
    timeout: 3s
    dns:
      query_name: "api.huggingface.co"
      query_type: "A"
      preferred_ip_protocol: "ip4"

  icmp_probe:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: "ip4"
